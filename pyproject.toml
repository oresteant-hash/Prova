[project]
name = "momentum-atelier"
version = "1.0.0"
description = "Analisi e backtest verificabili di una strategia momentum multi-asset in EUR"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pandas>=2.2,<3.1",
    "numpy>=2,<3",
    "yfinance>=0.2.65,<2",
    "httpx>=0.27,<1",
    "exchange-calendars>=4.11,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10", "playwright>=1.50,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
